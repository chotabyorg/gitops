name: AIStor GREEN validation

on:
  pull_request:
    paths:
      - "services/repetly/prod/operations/aistor-green/**"
      - ".github/workflows/aistor-green-validation.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-and-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27564c9af683

      - name: Install Helm 3.18.6 with checksum verification
        shell: bash
        run: |
          set -euo pipefail
          HELM_TARBALL="${RUNNER_TEMP}/helm-v3.18.6-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location \
            https://get.helm.sh/helm-v3.18.6-linux-amd64.tar.gz \
            --output "${HELM_TARBALL}"
          printf '%s  %s\n' \
            3f43c0aa57243852dd542493a0f54f1396c0bc8ec7296bbb2c01e802010819ce \
            "${HELM_TARBALL}" | sha256sum --check --status
          tar -xzf "${HELM_TARBALL}" -C "${RUNNER_TEMP}"
          sudo install -m 0755 "${RUNNER_TEMP}/linux-amd64/helm" /usr/local/bin/helm
          helm version --short

      - name: Render and verify AIStor contracts
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_DIR="${RUNNER_TEMP}/aistor-green" \
            services/repetly/prod/operations/aistor-green/tests/validate-render.sh
          cat "${OUTPUT_DIR}/render-summary.md" >> "${GITHUB_STEP_SUMMARY}"

  networkpolicy-k3s:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27564c9af683

      - name: Exercise exact NetworkPolicy selectors with embedded k3s kube-router
        shell: bash
        run: services/repetly/prod/operations/aistor-green/tests/run-k3s-networkpolicy.sh
