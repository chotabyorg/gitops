name: Repetly isolated backup restore drill

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"
  pull_request:
    paths:
      - "services/repetly/prod/operations/postgres-backup/**"
      - ".github/workflows/repetly-isolated-backup-restore-drill.yaml"
  push:
    branches: [main]
    paths:
      - "services/repetly/prod/operations/postgres-backup/**"
      - ".github/workflows/repetly-isolated-backup-restore-drill.yaml"

permissions:
  contents: read

jobs:
  isolated-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run disposable DB+files restore drill
        run: bash services/repetly/prod/operations/postgres-backup/tests/run-isolated-restore-drill.sh
      - name: Upload sanitized drill evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repetly-isolated-restore-drill
          path: artifacts/restore-drill
          if-no-files-found: warn
