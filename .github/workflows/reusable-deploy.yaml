name: Reusable Deploy
on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
        description: Service name (must match directory in services/)
      gitops_repo:
        required: true
        type: string
        description: GitOps repository (owner/repo)
      gitops_branch:
        required: false
        type: string
        default: main

    secrets:
      GITOPS_PAT:
        required: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout service repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            APP_COMMIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout gitops repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.gitops_repo }}
          ref: ${{ inputs.gitops_branch }}
          path: gitops
          token: ${{ secrets.GITOPS_PAT }}

      - name: Update image reference in gitops
        env:
          SERVICE: ${{ inputs.service }}
          IMAGE: ghcr.io/${{ github.repository }}
          SHA: ${{ github.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cd gitops
          KUSTOMIZATION_FILE="services/${SERVICE}/prod/kustomization.yaml"
          if [ ! -f "$KUSTOMIZATION_FILE" ]; then
            echo "Error: $KUSTOMIZATION_FILE not found"
            exit 1
          fi
          SHORT_SHA=$(echo "$SHA" | cut -c1-7)

          if [ "$(yq e ".images[] | select(.name == \"${SERVICE}\") | has(\"digest\")" "$KUSTOMIZATION_FILE")" = "true" ]; then
            yq e -i "(.images[] | select(.name == \"${SERVICE}\")).digest = \"${DIGEST}\"" "$KUSTOMIZATION_FILE"
          fi

          yq e -i "(.images[] | select(.name == \"${SERVICE}\")).newTag = \"${SHORT_SHA}\"" "$KUSTOMIZATION_FILE"

          RELEASE_IDENTITY_PATCH="services/${SERVICE}/prod/operations/secure-telegram-linking/release-identity-patch.yaml"
          if [ "$SERVICE" = "repetly" ] && [ -f "$RELEASE_IDENTITY_PATCH" ]; then
            yq e -i ".metadata.annotations.\"repetly.chota.by/application-commit\" = \"${SHA}\"" "$RELEASE_IDENTITY_PATCH"
            yq e -i ".metadata.annotations.\"repetly.chota.by/application-image-digest\" = \"${DIGEST}\"" "$RELEASE_IDENTITY_PATCH"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$KUSTOMIZATION_FILE"
          if [ -f "$RELEASE_IDENTITY_PATCH" ]; then
            git add "$RELEASE_IDENTITY_PATCH"
          fi
          git commit -m "chore(${SERVICE}): update release image to ${SHORT_SHA}"
          git push
