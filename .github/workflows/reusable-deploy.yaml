name: Reusable Deploy
on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
        description: Service name (must match directory in services/)
      gitops_repo:
        required: true
        type: string
        description: GitOps repository (owner/repo)
      gitops_branch:
        required: false
        type: string
        default: main

    secrets:
      GITOPS_PAT:
        required: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout service repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout gitops repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.gitops_repo }}
          ref: ${{ inputs.gitops_branch }}
          path: gitops
          token: ${{ secrets.GITOPS_PAT }}

      - name: Update image tag in gitops
        env:
          SERVICE: ${{ inputs.service }}
          IMAGE: ghcr.io/${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          cd gitops
          KUSTOMIZATION_FILE="services/${SERVICE}/prod/kustomization.yaml"
          if [ ! -f "$KUSTOMIZATION_FILE" ]; then
            echo "Error: $KUSTOMIZATION_FILE not found"
            exit 1
          fi
          SHORT_SHA=$(echo "$SHA" | cut -c1-7)
          yq e -i ".images[] |= select(.name == \"${SERVICE}\").newTag = \"${SHORT_SHA}\"" "$KUSTOMIZATION_FILE" 2>/dev/null || \
          sed -i "s|newTag: .*|newTag: \"${SHORT_SHA}\"|" "$KUSTOMIZATION_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$KUSTOMIZATION_FILE"
          git commit -m "chore(${SERVICE}): update image tag to ${SHORT_SHA}"
          git push
