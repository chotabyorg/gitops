apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chota-va-inert
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: chota-va
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: voice
          podSelector:
            matchLabels:
              app.kubernetes.io/name: chota-va-smoke
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - ipBlock:
            cidr: 10.250.0.1/32
      ports:
        - protocol: TCP
          port: 18080
    - to:
        - ipBlock:
            cidr: 10.250.0.1/32
      ports:
        - protocol: TCP
          port: 18081
