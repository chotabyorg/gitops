apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chota-va-voice
  namespace: argocd
spec:
  project: voice
  source:
    repoURL: git@github.com:chotabyorg/gitops.git
    targetRevision: main
    path: clusters/voice/apps/chota-va
  destination:
    name: voice
    namespace: voice
  syncPolicy:
    syncOptions:
      - PruneLast=true
