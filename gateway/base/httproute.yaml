apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chota-routes
spec:
  parentRefs:
    - name: chota-gateway
      namespace: gateway
      sectionName: http
  hostnames:
    - "chota.by"
    - "api.chota.by"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: chota-gateway
          namespace: dev
          port: 8080
