apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`argocd.chota.by`)
      services:
        - kind: Service
          name: argocd-server
          namespace: argocd
          port: 443
          scheme: https
          serversTransport: skip-tls-verify
  tls:
    certResolver: le
