apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: prod-services
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: git@github.com:chotabyorg/gitops.git
        revision: main
        directories:
          - path: "services/*/prod"
  template:
    metadata:
      name: "{{path.basename}}-prod"
    spec:
      project: default
      source:
        repoURL: git@github.com:chotabyorg/gitops.git
        targetRevision: main
        path: "{{path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: prod
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
