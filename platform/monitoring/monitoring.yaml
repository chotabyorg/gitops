apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
      targetRevision: 88.5.4
      helm:
        valueFiles:
          - $values/platform/monitoring/values.yaml
    - repoURL: git@github.com:chotabyorg/gitops.git
      targetRevision: main
      ref: values
    - repoURL: git@github.com:chotabyorg/gitops.git
      targetRevision: main
      path: platform/monitoring
  destination:
    name: "in-cluster"
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
