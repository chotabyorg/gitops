alertmanager:
  enabled: false

grafana:
  envValueFrom:
    GF_AUTH_GITHUB_CLIENT_ID:
      secretKeyRef:
        name: grafana-secrets
        key: client_id
    GF_AUTH_GITHUB_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-secrets
        key: client_secret
  grafana.ini:
    server:
      root_url: https://grafana.chota.by
    security:
      disable_initial_admin_creation: true
    auth:
      disable_login_form: true
    auth.github:
      enabled: true
      allow_sign_up: true
      auto_login: true
      scopes: user:email,read:org
      auth_url: https://github.com/login/oauth/authorize
      token_url: https://github.com/login/oauth/access_token
      api_url: https://api.github.com/user
      allowed_organizations: chotabyorg
      allow_assign_grafana_admin: true
      role_attribute_path: "[login=='NeOchenHorosho'][0] && 'GrafanaAdmin' || 'Admin'"
  defaultDashboardsTimezone: Europe/Minsk
  persistence:
    enabled: true
    type: sts
    storageClassName: local-path
    accessModes:
      - ReadWriteOnce
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 20GB
    resources:
      requests:
        cpu: 300m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
