apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: zot-registry
  namespace: registry
  labels:
    app.kubernetes.io/name: zot
    app.kubernetes.io/component: registry
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`registry.chota.by`)
      kind: Rule
      services:
        - name: zot-registry
          port: 5000
  tls:
    certResolver: le
