apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: agents-chota-by
  namespace: prod
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`agents.chota.by`)
      services:
        - kind: Service
          name: chota-site
          namespace: prod
          port: 3000
  tls:
    certResolver: le
