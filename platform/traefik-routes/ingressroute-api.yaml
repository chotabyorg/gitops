apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: api-chota-by
  namespace: prod
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`api.chota.by`)
      services:
        - kind: Service
          name: chota-gateway
          namespace: prod
          port: 8080
  tls:
    certResolver: le
