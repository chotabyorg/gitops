apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-http-chota
  namespace: prod
spec:
  redirectRegex:
    regex: ^http://(www\.)?chota\.by/(.*)
    replacement: https://chota.by/${2}
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: chota-by-http
  namespace: prod
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`chota.by`) || Host(`www.chota.by`)
      middlewares:
        - name: redirect-http-chota
          namespace: prod
      services:
        - kind: Service
          name: outsors
          namespace: prod
          port: 80
