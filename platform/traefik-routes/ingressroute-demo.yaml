apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: demo-chota-by
  namespace: prod
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`demo.chota.by`)
      services:
        - kind: Service
          name: demo-website-external
          namespace: prod
          port: 80
  tls:
    certResolver: le
