apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: repetly-storage-chota-by
  namespace: prod
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`repetly-storage.chota.by`)
      services:
        - kind: Service
          name: repetly-minio
          namespace: prod
          port: 9000
  tls:
    certResolver: le
