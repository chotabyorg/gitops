apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: repetly-chota-by
  namespace: prod
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`repetly.chota.by`)
      services:
        - kind: Service
          name: repetly
          namespace: prod
          port: 3000
  tls:
    certResolver: le
