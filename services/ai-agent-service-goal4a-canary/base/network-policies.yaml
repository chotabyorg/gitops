apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: goal4a-ai-canary
  annotations: {argocd.argoproj.io/sync-wave: '-4'}
spec:
  podSelector: {matchLabels: {app: ai-agent-service-goal4a-canary, component: api}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: conversation-service, component: api}}
        - podSelector: {matchLabels: {app: conversation-service, component: worker}}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - podSelector: {matchLabels: {app: ai-agent-service, component: postgres}}
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - podSelector: {matchLabels: {app: ai-agent-service-goal4a-llm-relay, component: relay}}
      ports: [{protocol: TCP, port: 8080}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: goal4a-ai-role-lifecycle
  annotations: {argocd.argoproj.io/sync-wave: '-4'}
spec:
  podSelector: {matchLabels: {app: ai-agent-service-goal4a-canary, component: role-lifecycle}}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - podSelector: {matchLabels: {app: ai-agent-service, component: postgres}}
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
