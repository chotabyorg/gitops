apiVersion: batch/v1
kind: Job
metadata:
  name: goal4a-ai-readonly-provision-v2
  annotations: {argocd.argoproj.io/sync-wave: '-2'}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 240
  template:
    metadata:
      labels: {app: ai-agent-service-goal4a-canary, component: role-lifecycle}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets: [{name: ghcr-pull-secret}]
      nodeSelector: {kubernetes.io/hostname: chota.by, kubernetes.io/arch: amd64}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: role-provision
          image: goal4a-accepted-ai
          imagePullPolicy: IfNotPresent
          command: [python, -I, -B, /operations/role.py, provision]
          env:
            - {name: POSTGRES_HOST, value: ai-agent-service-postgres}
            - {name: POSTGRES_PORT, value: '5432'}
            - name: ADMIN_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: ai-agent-secret, key: POSTGRES_PASSWORD}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: ai-goal4a-readonly-secret, key: POSTGRES_PASSWORD}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: operations, mountPath: /operations, readOnly: true}
            - {name: temporary, mountPath: /tmp}
      volumes:
        - name: operations
          configMap: {name: goal4a-role-operations}
        - name: temporary
          emptyDir: {medium: Memory, sizeLimit: 8Mi}
