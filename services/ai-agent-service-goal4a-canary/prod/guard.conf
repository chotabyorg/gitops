worker_processes 1;
pid /tmp/nginx.pid;
# Never emit nginx request/URI/header contexts, including critical error paths.
error_log /dev/null;
events { worker_connections 64; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 1m;
    client_body_timeout 5s;
    send_timeout 120s;
    proxy_connect_timeout 2s;
    proxy_read_timeout 120s;
    proxy_send_timeout 5s;
    proxy_next_upstream off;
    proxy_cache off;
    proxy_buffering off;
    proxy_request_buffering on;
    proxy_ignore_client_abort off;
    proxy_pass_request_headers off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host "127.0.0.1";
    proxy_set_header Content-Type "application/json";
    proxy_set_header X-Service-Token $http_x_service_token;
    server {
        listen 8080;
        location = /health {
            if ($request_uri != "/health") { return 404; }
            if ($request_method != GET) { return 405; }
            proxy_pass http://127.0.0.1:8000/health;
        }
        location = /internal/v1/managed-turns/execute {
            if ($request_uri != "/internal/v1/managed-turns/execute") { return 404; }
            if ($request_method != POST) { return 405; }
            proxy_pass http://127.0.0.1:8000/internal/v1/managed-turns/execute;
        }
        location = /internal/v1/managed-turns/evidence {
            if ($request_uri != "/internal/v1/managed-turns/evidence") { return 404; }
            if ($request_method != POST) { return 405; }
            proxy_pass http://127.0.0.1:8000/internal/v1/managed-turns/evidence;
        }
        location / { return 404; }
    }
}
