apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: goal4a-ai-llm-relay
  annotations: {argocd.argoproj.io/sync-wave: '-4'}
spec:
  podSelector: {matchLabels: {app: ai-agent-service-goal4a-llm-relay, component: relay}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: ai-agent-service-goal4a-canary, component: api}}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - ipBlock: {cidr: '8.47.69.10/32'}
      ports: [{protocol: TCP, port: 443}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
