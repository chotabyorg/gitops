worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 64; }
http {
    log_format bounded escape=json '{"event":"goal4a_llm_relay","request_id":"$request_id","status":$status,"upstream_status":"$upstream_status","upstream_addr":"$upstream_addr","request_time":"$request_time"}';
    access_log /dev/stdout bounded;
    server_tokens off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 1m;
    client_body_timeout 5s;
    send_timeout 120s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 10s;
    proxy_next_upstream off;
    proxy_cache off;
    proxy_buffering off;
    proxy_request_buffering on;
    proxy_ignore_client_abort off;
    proxy_pass_request_headers off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host "openrouter.ai";
    proxy_set_header Content-Type "application/json";
    proxy_set_header Authorization $http_authorization;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_server_name on;
    proxy_ssl_name openrouter.ai;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_redirect off;
    proxy_ignore_headers X-Accel-Redirect;
    proxy_hide_header X-Accel-Redirect;
    proxy_hide_header Location;
    proxy_intercept_errors on;
    upstream fixed_openrouter { server 8.47.69.10:443; }
    server {
        listen 8080;
        location = /health {
            access_log off;
            if ($request_uri != "/health") { return 404; }
            if ($request_method != GET) { return 405; }
            return 200 "ok\n";
        }
        location = /api/v1/chat/completions {
            if ($request_uri != "/api/v1/chat/completions") { return 404; }
            if ($request_method != POST) { return 405; }
            error_page 300 301 302 303 304 305 306 307 308 =502 @provider_redirect_blocked;
            proxy_pass https://fixed_openrouter/api/v1/chat/completions;
        }
        location @provider_redirect_blocked {
            default_type application/json;
            return 502 '{"error":{"message":"provider redirect rejected"}}';
        }
        location / { return 404; }
    }
}
