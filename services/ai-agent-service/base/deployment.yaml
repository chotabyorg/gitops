apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-service
spec:
  replicas: 1
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - image: ai-agent-service
          name: ai-agent-service
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ai-agent-config
            - secretRef:
                name: ai-agent-secret
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import httpx; httpx.get('http://localhost:8000/health', timeout=5)"
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import httpx; httpx.get('http://localhost:8000/health', timeout=5)"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
