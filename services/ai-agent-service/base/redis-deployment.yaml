apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-service-redis
spec:
  replicas: 1
  template:
    metadata:
      labels:
        component: redis
    spec:
      containers:
        - image: redis:7-alpine
          name: redis
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: ai-agent-service-redis-data
