worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 128; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 1m;
    client_body_timeout 5s;
    send_timeout 5s;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
    proxy_next_upstream off;
    proxy_cache off;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_ignore_client_abort off;
    proxy_intercept_errors off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $proxy_host;
    proxy_pass_request_headers off;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-User-Id $http_x_user_id;
    server {
        listen 127.0.0.1:18081;
        location = /healthz { return 200 "ok\n"; }
        location ^~ /internal/agent/v1/ {
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_server_name on;
            proxy_ssl_name chota-crm-service.prod.svc.cluster.local;
            proxy_ssl_trusted_certificate /etc/business-tls/ca.crt;
            proxy_ssl_certificate /etc/business-tls/tls.crt;
            proxy_ssl_certificate_key /etc/business-tls/tls.key;
            proxy_pass https://chota-crm-service.prod.svc.cluster.local:8443;
        }
        location / { return 404; }
    }
}
