apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
namespace: prod
images:
  - name: ai-agent-service
    newName: ghcr.io/chotabyorg/ai-agent-service
    newTag: latest
configMapGenerator:
  - name: ai-agent-config
    env: config.properties
  - name: postgres-config
    env: postgres.properties
secretGenerator:
  - name: ai-agent-secret
    env: secrets.properties