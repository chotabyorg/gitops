apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - conversation-business-sealed-secret.json
  - voice-managed-sealed-secret.json
  - sealed-secrets.yaml
  - chat-s2s-sealed-secret.yaml
  - business-transport/sealed-secret.yaml
  - business-transport/signing-sealed-secret.yaml
  - beauty-managed-sealed-secret.json
  - mcp-credentials-backfill-job.yaml
patches:
  - path: conversation-business-patch.yaml
  - path: business-transport/deployment-patch.yaml
  - path: migration-chat-auth-patch.yaml
  - path: beauty-managed-principal-patch.yaml
  - path: goal4b-managed-registry-restart-patch.yaml
  - path: business-transport/native-sidecar-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: ai-agent-service
  - path: voice-managed-patch.json
  - path: voice-latency-patch.yaml
namespace: prod
images:
  - name: ai-agent-service
    newName: ghcr.io/chotabyorg/ai-agent-service
    newTag: "a944ea9"
    digest: sha256:776635436294ecf8e11e067087a8f17c7cde0540ac38d1d2bb1f7f2fcd880660
configMapGenerator:
  - name: ai-agent-config
    env: config.properties
  - name: ai-agent-service-postgres-config
    env: postgres.properties
  - name: ai-business-tls-config
    files:
      - nginx.conf=business-transport/nginx.conf
