apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - sealed-secrets.yaml
  - chat-s2s-sealed-secret.yaml
  - business-transport/sealed-secret.yaml
  - business-transport/signing-sealed-secret.yaml
  - beauty-managed-sealed-secret.json
  - mcp-credentials-backfill-job.yaml
patches:
  - path: business-transport/deployment-patch.yaml
  - path: migration-chat-auth-patch.yaml
  - path: beauty-managed-principal-patch.yaml
namespace: prod
images:
  - name: ai-agent-service
    newName: ghcr.io/chotabyorg/ai-agent-service
    newTag: "d03c71b"
    digest: sha256:4a2d70ceeeae269c51fc5bf96ed3e9110d25e267125d00746f5a5b9b7ca3dfad
configMapGenerator:
  - name: ai-agent-config
    env: config.properties
  - name: ai-agent-service-postgres-config
    env: postgres.properties
  - name: ai-business-tls-config
    files:
      - nginx.conf=business-transport/nginx.conf
