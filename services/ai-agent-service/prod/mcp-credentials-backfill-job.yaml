apiVersion: batch/v1
kind: Job
metadata:
  name: ai-agent-mcp-credentials-backfill
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  activeDeadlineSeconds: 1800
  backoffLimit: 1
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      restartPolicy: Never
      containers:
        - name: encrypt-mcp-credentials
          image: ai-agent-service
          command:
            - python
            - -m
            - scripts.encrypt_mcp_credentials
            - --batch-size
            - "100"
            - --max-passes
            - "3"
          envFrom:
            - configMapRef:
                name: ai-agent-config
          env:
            - name: CHAT_S2S_AUTH_REQUIRED
              value: "false"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-agent-secret
                  key: POSTGRES_PASSWORD
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-agent-secret
                  key: ENCRYPTION_KEY
