apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas
  labels:
    app: atlas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atlas
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: atlas
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: web
          image: atlas
          command: [nginx, '-g', 'daemon off;']
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: '1', memory: 128Mi}
          volumeMounts:
            - {name: web-tmp, mountPath: /tmp}
          readinessProbe:
            httpGet: {path: /api/health, port: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
        - name: api
          image: atlas
          # The image's standalone entrypoint supervises API + nginx. In this
          # split Kubernetes pod nginx runs in the web container, so the API
          # container must run only the API process and avoid nginx temp paths
          # on its read-only root filesystem.
          command: [node, server/index.mjs]
          envFrom:
            - configMapRef: {name: atlas-config}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: '1', memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: atlas-data}
        - name: web-tmp
          emptyDir: {medium: Memory, sizeLimit: 32Mi}
