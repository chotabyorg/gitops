{
  "apiVersion": "batch/v1",
  "kind": "Job",
  "metadata": {
    "name": "atlas-admin-bootstrap-20260906"
  },
  "spec": {
    "backoffLimit": 1,
    "activeDeadlineSeconds": 120,
    "template": {
      "metadata": {
        "labels": {
          "app": "atlas-admin-bootstrap"
        }
      },
      "spec": {
        "restartPolicy": "Never",
        "automountServiceAccountToken": false,
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 1000,
          "runAsGroup": 1000,
          "fsGroup": 1000
        },
        "imagePullSecrets": [
          {
            "name": "ghcr-pull-secret"
          }
        ],
        "affinity": {
          "podAffinity": {
            "requiredDuringSchedulingIgnoredDuringExecution": [
              {
                "labelSelector": {
                  "matchLabels": {
                    "app": "atlas"
                  }
                },
                "topologyKey": "kubernetes.io/hostname"
              }
            ]
          }
        },
        "containers": [
          {
            "name": "bootstrap",
            "image": "ghcr.io/chotabyorg/atlas@sha256:a7598f95bec7b132a5e58bfd6a85f0b92dc6427dc0b9ab06ff09c1d0177bf03e",
            "command": [
              "node",
              "--input-type=module",
              "-e",
              "import { DatabaseSync } from 'node:sqlite';\nimport { existsSync } from 'node:fs';\nif (!existsSync('/data/chota.sqlite')) throw new Error('Live database missing');\nconst db = new DatabaseSync('/data/chota.sqlite');\ntry {\n  db.exec('PRAGMA busy_timeout=5000; BEGIN IMMEDIATE');\n  const existing = db.prepare('SELECT password FROM admins WHERE username=?').get('mikita');\n  if (existing && existing.password !== process.env.ADMIN_VERIFIER) throw new Error('Existing administrator differs; refusing overwrite');\n  if (!existing) db.prepare('INSERT INTO admins(username,password) VALUES(?,?)').run('mikita', process.env.ADMIN_VERIFIER);\n  db.exec('COMMIT');\n  console.log('Administrator provisioned');\n} finally { db.close(); }\n"
            ],
            "env": [
              {
                "name": "ADMIN_VERIFIER",
                "value": "7c96b4d0898db87864cb4153fe3f257a:8a7220ce8cf06262b92e44e98ec837df6661c24a26aea0028104fec8d363f98a6f385ecd620953d9100d44093699553deacce75221d1b681164140e6f9467fd2"
              }
            ],
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "resources": {
              "requests": {
                "cpu": "10m",
                "memory": "32Mi"
              },
              "limits": {
                "cpu": "250m",
                "memory": "128Mi"
              }
            },
            "volumeMounts": [
              {
                "name": "data",
                "mountPath": "/data"
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "data",
            "persistentVolumeClaim": {
              "claimName": "atlas-data"
            }
          }
        ]
      }
    }
  }
}
