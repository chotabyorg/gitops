apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas
spec:
  template:
    spec:
      initContainers:
        - name: backup-before-osteology
          image: ghcr.io/chotabyorg/atlas@sha256:38dd283d471c9fec5e59d2e1d79afec018554fbf7658b53fb931a85f43f58bf4
          command:
            - node
            - --input-type=module
            - -e
            - |
              import { DatabaseSync, backup } from 'node:sqlite';
              import { existsSync, chmodSync, renameSync } from 'node:fs';
              const source='/data/chota.sqlite', target='/data/pre-privacy-20260908.sqlite';
              function verify(path) {
                const db=new DatabaseSync(path,{readOnly:true});
                try { if(db.prepare('PRAGMA quick_check').get().quick_check !== 'ok') throw new Error('Backup integrity check failed'); }
                finally {db.close();}
              }
              if(existsSync(target)) { verify(target); console.log('Verified existing pre-osteology backup'); }
              else if(existsSync(source)) {
                const db=new DatabaseSync(source,{readOnly:true});
                try { await backup(db,target+'.tmp'); } finally {db.close();}
                verify(target+'.tmp'); chmodSync(target+'.tmp',0o600); renameSync(target+'.tmp',target);
                console.log('Pre-osteology SQLite backup verified');
              } else console.log('Fresh installation: no database to back up');
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
        - name: backup-before-f699
          image: ghcr.io/chotabyorg/atlas@sha256:38dd283d471c9fec5e59d2e1d79afec018554fbf7658b53fb931a85f43f58bf4
          command:
            - node
            - --input-type=module
            - -e
            - |
              import { DatabaseSync, backup } from 'node:sqlite';
              import { existsSync, chmodSync, renameSync, rmSync } from 'node:fs';
              const source='/data/chota.sqlite', target='/data/pre-f699-20260923.sqlite', temporary=target+'.tmp';
              function verify(path) {
                const db=new DatabaseSync(path,{readOnly:true});
                try { if(db.prepare('PRAGMA quick_check').get().quick_check !== 'ok') throw new Error('SQLite integrity check failed'); }
                finally { db.close(); }
              }
              if(!existsSync(source)) throw new Error('Production SQLite database is missing');
              verify(source);
              if(existsSync(target)) { verify(target); console.log('Verified existing pre-f699 backup'); }
              else {
                rmSync(temporary,{force:true});
                const db=new DatabaseSync(source,{readOnly:true});
                try { await backup(db,temporary); } finally { db.close(); }
                verify(temporary); chmodSync(temporary,0o600); renameSync(temporary,target);
                console.log('Pre-f699 SQLite backup verified');
              }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
