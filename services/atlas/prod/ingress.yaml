apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: atlas-chota-by
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`atlas.chota.by`) && (PathPrefix(`/api`) || PathPrefix(`/learn`) || Path(`/sitemap.xml`) || Path(`/robots.txt`) || Path(`/llms.txt`))
      priority: 100
      services:
        - name: atlas
          port: 8080
    - kind: Rule
      match: Host(`atlas.chota.by`)
      priority: 10
      services:
        - name: atlas-web-green
          port: 8080
  tls:
    certResolver: le
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: atlas-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: atlas-chota-by-http
spec:
  entryPoints: [web]
  routes:
    - kind: Rule
      match: Host(`atlas.chota.by`)
      middlewares:
        - name: atlas-https
      services:
        - name: atlas-web-green
          port: 8080
