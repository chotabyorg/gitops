apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: atlas-chota-by
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`atlas.chota.by`) && (PathPrefix(`/api`) || PathPrefix(`/learn`) || Path(`/sitemap.xml`) || Path(`/robots.txt`) || Path(`/llms.txt`))
      priority: 100
      services:
        - name: atlas
          port: 8080
    - kind: Rule
      match: Host(`atlas.chota.by`) && Header(`X-Atlas-Preview`, `cns-4729ed0`)
      priority: 96
      services:
        - name: atlas-web-blue
          port: 8080
    - kind: Rule
      match: Host(`atlas.chota.by`) && Header(`X-Atlas-Preview`, `lumbar-f6ec73c-20261002`)
      priority: 95
      services:
        - name: atlas-web-green
          port: 8080
    - kind: Rule
      match: Host(`atlas.chota.by`) && (Path(`/admin`) || PathPrefix(`/admin/`) || Path(`/privacy`) || Path(`/consent`))
      priority: 90
      services:
        - name: atlas-web-blue
          port: 8080
    - kind: Rule
      match: Host(`atlas.chota.by`)
      priority: 10
      services:
        - name: atlas-web-blue
          port: 8080
  tls:
    certResolver: le
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: atlas-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: atlas-chota-by-http
spec:
  entryPoints: [web]
  routes:
    - kind: Rule
      match: Host(`atlas.chota.by`)
      middlewares:
        - name: atlas-https
      services:
        - name: atlas-web-blue
          port: 8080
