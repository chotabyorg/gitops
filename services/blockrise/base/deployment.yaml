apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockrise
spec:
  replicas: 1
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - image: blockrise
          name: blockrise
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: blockrise-config
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
