apiVersion: apps/v1
kind: Deployment
metadata:
  name: chota-crm-service
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 900
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
      - name: ghcr-pull-secret
      terminationGracePeriodSeconds: 30
      initContainers:
      - image: chota-crm-service
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: chota-crm-service-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: chota-crm-service-secret
              key: DATABASE_URL
        - name: PYTHONPATH
          value: /app
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: migration-script
          mountPath: /opt/crm
          readOnly: true
        name: migrations
        command:
        - python
        - /opt/crm/migrate.py
      containers:
      - image: chota-crm-service
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: chota-crm-service-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: chota-crm-service-secret
              key: DATABASE_URL
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        name: chota-crm-service
        ports:
        - name: http
          containerPort: 8000
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: migration-script
        configMap:
          name: chota-crm-service-migration
          defaultMode: 292
