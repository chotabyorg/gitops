apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chota-crm-service-postgres-data
  annotations:
    argocd.argoproj.io/sync-wave: '0'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 4Gi
