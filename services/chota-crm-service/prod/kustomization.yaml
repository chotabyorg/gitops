apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../base
- sealed-secrets.yaml
namespace: prod
images:
- name: chota-crm-service
  newName: ghcr.io/chotabyorg/chota-crm-service
  newTag: e0127c7d98014e122b78e84684a938db1294e4db
  digest: sha256:5480abfddfcc030d17107ba820777ff02467924aaa6472abd3b9c13c412d2df0
- name: postgres
  newName: postgres
  newTag: 18.6-alpine3.24
  digest: sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
configMapGenerator:
- name: chota-crm-service-config
  envs:
  - config.properties
- name: chota-crm-service-postgres-config
  envs:
  - postgres.properties
- name: chota-crm-service-backup-config
  envs:
  - backup.properties
- name: chota-crm-service-migration
  files:
  - migrate.py
- name: chota-crm-service-backup-scripts
  files:
  - backup-ready.sh
  - backup.sh
  - restore-check.sh
generatorOptions:
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
