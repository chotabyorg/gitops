apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../base
- sealed-secrets.yaml
- business-transport/sealed-secret.yaml
namespace: prod
patches:
- path: business-transport/deployment-patch.yaml
- path: business-transport/service-patch.yaml
- path: business-transport/network-policy-patch.yaml
images:
- name: chota-crm-service
  newName: ghcr.io/chotabyorg/chota-crm-service
  newTag: a9aa8984756a213ed74b468e46c270283d698262
  digest: sha256:bd4c0a387746472cc5ca1ef982c6c4ae86f39793684ba56c29f21f986b36ae61
- name: postgres
  newName: postgres
  newTag: 18.6-alpine3.24
  digest: sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
configMapGenerator:
- name: chota-crm-service-config
  envs:
  - config.properties
- name: chota-crm-service-postgres-config
  envs:
  - postgres.properties
- name: chota-crm-service-backup-config
  envs:
  - backup.properties
- name: chota-crm-service-migration
  files:
  - migrate.py
- name: chota-crm-service-backup-scripts
  files:
  - backup-ready.sh
  - backup.sh
  - restore-check.sh
- name: crm-business-tls-config
  files:
  - nginx.conf=business-transport/nginx.conf
generatorOptions:
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
