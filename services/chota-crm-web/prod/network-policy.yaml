apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chota-crm-web
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  podSelector:
    matchLabels:
      app: chota-crm-web
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
          app.kubernetes.io/instance: traefik-kube-system
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: TCP
      port: 3000
  egress: []
