apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chota-gateway
spec:
  ingressClassName: traefik
  rules:
    - host: chota.by
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chota-gateway
                port:
                  number: 8080
    - host: api.chota.by
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chota-gateway
                port:
                  number: 8080
