apiVersion: apps/v1
kind: Deployment
metadata:
  name: chota-site
spec:
  replicas: 1
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - image: chota-site
          name: chota-site
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: chota-site-config
            - secretRef:
                name: chota-site-secret
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5