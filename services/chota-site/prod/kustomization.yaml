apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
namespace: prod
images:
  - name: chota-site
    newName: ghcr.io/chotabyorg/chota-site
    newTag: latest
configMapGenerator:
  - name: chota-site-config
    env: config.properties
secretGenerator:
  - name: chota-site-secret
    env: secrets.properties