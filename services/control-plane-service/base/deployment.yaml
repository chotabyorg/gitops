apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane-service
spec:
  replicas: 1
  template:
    metadata:
      labels:
        component: api
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - image: control-plane-service
          name: control-plane-service
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: control-plane-config
            - secretRef:
                name: control-plane-secret
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - import httpx; httpx.get('http://localhost:8000/health', timeout=5)
            failureThreshold: 3
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
