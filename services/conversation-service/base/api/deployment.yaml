apiVersion: apps/v1
kind: Deployment
metadata:
  name: conversation-service
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 900
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        goal4a.chota.by/postgres-storage-layout: pvc-data-v1
        goal4a.chota.by/storage-persistence-proof: recreate-v1
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: conversation-migrations
          image: conversation-service
          command: [python, /migration/migrate.py]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: conversation-database-secret
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: migration
              mountPath: /migration
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: conversation-service
          image: conversation-service
          command: [uvicorn, main:app, --host, 0.0.0.0, --port, '8000', --no-access-log]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: conversation-database-secret
                  key: DATABASE_URL
            - name: CONVERSATION_AUTH_PRINCIPALS
              valueFrom:
                secretKeyRef:
                  name: conversation-principals-secret
                  key: API_AUTH_PRINCIPALS
            - name: MANAGED_AI_BINDINGS
              valueFrom:
                secretKeyRef:
                  name: conversation-managed-ai-secret
                  key: MANAGED_AI_BINDINGS
          envFrom:
            - configMapRef:
                name: conversation-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 750m
              memory: 384Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: migration
          configMap:
            name: conversation-migration
            defaultMode: 0444
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
