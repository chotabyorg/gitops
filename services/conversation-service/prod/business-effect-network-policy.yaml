apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: conversation-business-effect-ingress
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  podSelector:
    matchLabels:
      app: conversation-service
      component: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ai-agent-service
              component: api
      ports:
        - protocol: TCP
          port: 8000
