{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "conversation-service"
  },
  "spec": {
    "template": {
      "spec": {
        "containers": [
          {
            "name": "conversation-service",
            "env": [
              {
                "name": "MANAGED_AI_BINDINGS",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "conversation-beauty-managed-secret",
                    "key": "MANAGED_AI_BINDINGS"
                  }
                },
                "value": null
              }
            ]
          }
        ]
      }
    }
  }
}
