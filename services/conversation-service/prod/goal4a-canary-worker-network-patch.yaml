apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: conversation-service-worker
spec:
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: conversation-service
          component: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: ai-agent-service-goal4a-canary
          component: api
    ports:
    - protocol: TCP
      port: 8080
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
