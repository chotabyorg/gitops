apiVersion: apps/v1
kind: Deployment
metadata:
  name: conversation-service
spec:
  template:
    spec:
      containers:
      - name: conversation-service
        env:
        - name: INBOX_LIFECYCLE_TOKEN
          valueFrom:
            secretKeyRef:
              name: conversation-handoff-lifecycle-secret
              key: INBOX_LIFECYCLE_TOKEN
        - name: HANDOFF_LIFECYCLE_TOKEN
          valueFrom:
            secretKeyRef:
              name: conversation-handoff-lifecycle-secret
              key: HANDOFF_LIFECYCLE_TOKEN
        - name: CONVERSATION_AUTH_PRINCIPALS
          valueFrom:
            secretKeyRef:
              name: conversation-common-website-principals-secret
              key: API_AUTH_PRINCIPALS
