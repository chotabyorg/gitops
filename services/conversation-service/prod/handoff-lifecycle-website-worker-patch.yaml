apiVersion: apps/v1
kind: Deployment
metadata:
  name: conversation-service-worker
spec:
  template:
    spec:
      containers:
      - name: conversation-worker
        env:
        - name: INBOX_LIFECYCLE_TOKEN
          valueFrom:
            secretKeyRef:
              name: conversation-handoff-lifecycle-secret
              key: INBOX_LIFECYCLE_TOKEN
        - name: HANDOFF_LIFECYCLE_TOKEN
          valueFrom:
            secretKeyRef:
              name: conversation-handoff-lifecycle-secret
              key: HANDOFF_LIFECYCLE_TOKEN
        - name: MANAGED_AI_BINDINGS
          valueFrom:
            secretKeyRef:
              name: conversation-website-worker-managed-secret
              key: MANAGED_AI_BINDINGS
