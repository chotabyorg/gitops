apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: conversation-website-private-tls
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  podSelector:
    matchLabels:
      app: conversation-service
      component: api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: website-gateway-service
    ports:
    - protocol: TCP
      port: 8443
---
