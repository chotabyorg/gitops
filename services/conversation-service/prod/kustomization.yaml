# RELEASE INPUT TEMPLATE. Copy to services/conversation-service/prod only after
# genuine Main seals and independently reviewed immutable image inputs exist.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../base
  - ../base/retirement-worker
  - conversation-writer-attestation-secret.sealed.json
  - conversation-writer-recovery-secret.sealed.json
  - writer-retirement-network-policy.yaml
  - business-principals-sealed-secret.json
  - business-effect-network-policy.yaml
  - database-sealed-secret.yaml
  - principals-sealed-secret.yaml
  - managed-ai-sealed-secret.yaml
  - beauty-managed-sealed-secret.json
  - telegram-processing-sealed-secret.json
  - telegram-managed-ai-sealed-secret.json
  - voice-principals-sealed-secret.json
  - voice-managed-ai-sealed-secret.json
  - voice-s2s-service.json
  - handoff-lifecycle.sealed.json
  - common-website-principals.sealed.json
  - website-worker-managed.sealed.json
  - website-tls.sealed.json
  - handoff-network-policy.yaml
images:
  - name: conversation-service
    newName: ghcr.io/chotabyorg/conversation-service
    newTag: d1e41d582ccb7191ba93f8652a85b03fc5802c6a
    digest: sha256:28924aa627d95b040ec644dbd90a43c469d8d5a8d79bf96dfe9b36cb11a976c1
  - name: postgres
    newName: docker.io/library/postgres
    newTag: 16.15-alpine
    digest: sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
configMapGenerator:
  - name: conversation-config
    envs: [config.properties]
  - name: conversation-worker-config
    envs: [worker.properties]
  - name: conversation-telegram-worker-config
    envs: [telegram-worker.properties]
  - name: conversation-retirement-worker-config
    envs: [retirement-worker.properties]
  - name: conversation-postgres-config
    envs: [postgres.properties]
  - name: conversation-migration
    files: [migrate.py]
  - name: conversation-voice-config
    envs: [voice.properties]

  - name: conversation-website-tls-config
    files:
    - nginx.conf=website-transport/nginx.conf
generatorOptions:
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
patches:
  - path: writer-attestation-api-patch.yaml
  - path: inbox-owner-verifier-api-patch.yaml
  - target:
      kind: NetworkPolicy
      name: conversation-service-api
    patch: |-
      - op: add
        path: /spec/ingress/0/from/-
        value:
          podSelector:
            matchLabels:
              app: chota-gateway
      - op: add
        path: /spec/ingress/0/from/-
        value:
          podSelector:
            matchLabels:
              app: conversation-service
              component: retirement-worker
      - op: add
        path: /spec/egress/-
        value:
          to:
            - podSelector:
                matchLabels:
                  app: user-service
                  component: api
          ports:
            - protocol: TCP
              port: 8000
  - target:
      kind: NetworkPolicy
      name: conversation-service-postgres
    patch: |-
      - op: add
        path: /spec/ingress/0/from/-
        value:
          podSelector:
            matchLabels:
              app: conversation-service
              component: retirement-worker
  - path: business-effect-api-patch.yaml
  - path: goal4a-canary-api-binding-patch.yaml
  - path: goal4a-canary-worker-binding-patch.yaml
  - path: goal4a-worker-activation-patch.yaml
  - path: goal4a-retained-state-api-restart-patch.yaml
  - path: goal4a-retained-state-worker-restart-patch.yaml
  - path: goal4b-telegram-worker-activation-patch.yaml
  - path: voice-api-node-patch.json

  - path: handoff-lifecycle-api-patch.yaml
  - path: handoff-lifecycle-website-worker-patch.yaml
  - path: handoff-lifecycle-telegram-worker-patch.yaml
  - path: website-transport/deployment-patch.yaml
  - path: website-transport/service-patch.yaml
# Dedicated processes expose only the exact Voice principal/cohort.
replicas:
  - name: conversation-service-voice-api
    count: 1
  - name: conversation-service-voice-worker
    count: 1
