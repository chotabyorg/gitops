# RELEASE INPUT TEMPLATE. Copy to services/conversation-service/prod only after
# genuine Main seals and independently reviewed immutable image inputs exist.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../base
  - database-sealed-secret.yaml
  - principals-sealed-secret.yaml
  - managed-ai-sealed-secret.yaml
  - beauty-managed-sealed-secret.json
images:
  - name: conversation-service
    newName: ghcr.io/chotabyorg/conversation-service
    newTag: 058b78e4c0482036ad8bea6700b783cc77aa6006
    digest: sha256:89a1f37cedd36ed8779295469c2a181dbed84d6f215cc40ef4712a20cff79772
  - name: postgres
    newName: docker.io/library/postgres
    newTag: 16.15-alpine
    digest: sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
configMapGenerator:
  - name: conversation-config
    envs: [config.properties]
  - name: conversation-worker-config
    envs: [worker.properties]
  - name: conversation-postgres-config
    envs: [postgres.properties]
  - name: conversation-migration
    files: [migrate.py]
generatorOptions:
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
patches:
  - path: goal4a-canary-api-binding-patch.yaml
  - path: goal4a-canary-worker-binding-patch.yaml
  - path: goal4a-worker-activation-patch.yaml
  - path: goal4a-retained-state-api-restart-patch.yaml
  - path: goal4a-retained-state-worker-restart-patch.yaml
