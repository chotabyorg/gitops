worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null crit;
events { worker_connections 128; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 64k;
    client_body_buffer_size 64k;
    client_body_timeout 10s;
    client_header_timeout 3s;
    send_timeout 10s;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    proxy_next_upstream off;
    proxy_cache off;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    proxy_ignore_client_abort off;
    proxy_intercept_errors off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $proxy_host;
    proxy_pass_request_headers off;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header X-Service-Token $http_x_service_token;
    server {
        listen 127.0.0.1:18083;
        location = /healthz { return 200 "ok\n"; }
        location / { return 404; }
    }
    server {
        listen 8443 ssl;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /etc/website-tls/tls.crt;
        ssl_certificate_key /etc/website-tls/tls.key;
        add_header Cache-Control "no-store" always;
        location = /internal/v1/website/sessions {
            limit_except POST { deny all; }
            proxy_pass http://127.0.0.1:8000;
        }
        location = /internal/v1/website/sessions/admissions {
            limit_except POST { deny all; }
            proxy_pass http://127.0.0.1:8000;
        }
        location = /internal/v1/website/sessions/history {
            limit_except POST { deny all; }
            proxy_pass http://127.0.0.1:8000;
        }
        location = /internal/v1/website/sessions/polls/begin {
            limit_except POST { deny all; }
            proxy_pass http://127.0.0.1:8000;
        }
        location = /internal/v1/website/sessions/polls/end {
            limit_except POST { deny all; }
            proxy_pass http://127.0.0.1:8000;
        }
        location = /internal/v1/website/sessions/delivery/work {
            limit_except POST { deny all; }
            proxy_pass http://127.0.0.1:8000;
        }
        location = /internal/v1/website/sessions/delivery/begin {
            limit_except POST { deny all; }
            proxy_pass http://127.0.0.1:8000;
        }
        location = /internal/v1/website/sessions/delivery/complete {
            limit_except POST { deny all; }
            proxy_pass http://127.0.0.1:8000;
        }
        location / { return 404; }
    }
}
