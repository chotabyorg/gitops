apiVersion: batch/v1
kind: Job
metadata:
  name: document-service-minio-create-bucket
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        component: minio-create-bucket
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-bucket
          image: minio/mc:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MINIO_ENDPOINT
              value: "http://document-service-minio:9000"
            - name: S3_BUCKET
              value: "documents"
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: document-service-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: document-service-secret
                  key: MINIO_ROOT_PASSWORD
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until mc alias set document-minio "$MINIO_ENDPOINT" "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "Waiting for MinIO..."
                sleep 2
              done
              mc mb --ignore-existing "document-minio/$S3_BUCKET"
              mc ls "document-minio/$S3_BUCKET"
