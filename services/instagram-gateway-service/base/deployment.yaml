apiVersion: apps/v1
kind: Deployment
metadata:
  name: instagram-gateway-service
spec:
  replicas: 1
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - image: instagram-gateway-service
          name: instagram-gateway-service
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: instagram-gateway-config
            - secretRef:
                name: instagram-gateway-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3