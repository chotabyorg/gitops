apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
namespace: dev
images:
  - name: instagram-gateway-service
    newName: ghcr.io/chotabyorg/instagram-gateway-service
    newTag: latest
configMapGenerator:
  - name: instagram-gateway-config
    env: config.properties
secretGenerator:
  - name: instagram-gateway-secret
    env: secrets.properties