apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - sealed-secrets.yaml
namespace: prod
images:
  - name: knowledge-base-service
    newName: ghcr.io/chotabyorg/knowledge-base-service
    newTag: latest
configMapGenerator:
  - name: knowledge-base-config
    env: config.properties
  - name: knowledge-base-postgres-config
    env: postgres.properties
