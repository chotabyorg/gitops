apiVersion: v1
kind: Service
metadata: {name: mts-backend}
spec:
  selector: {app: mts-backend}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mts-backend}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy: {type: Recreate}
  template:
    metadata:
      labels: {app: mts-backend, mts-component: backend}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: ghcr-pull-secret}]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: migrations
          image: mts-backend
          command: [alembic, upgrade, head]
          envFrom:
            - configMapRef: {name: mts-backend-config}
            - secretRef: {name: mts-private}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      containers:
        - name: backend
          image: mts-backend
          command: [uvicorn, mts.main:app, --host, '0.0.0.0', --port, '8000', --no-access-log, --no-proxy-headers]
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: mts-backend-config}
            - secretRef: {name: mts-private}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: mts-artifacts}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
