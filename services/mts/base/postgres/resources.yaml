apiVersion: v1
kind: Service
metadata: {name: mts-postgres}
spec:
  selector: {app: mts-postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mts-postgres}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy: {type: Recreate}
  template:
    metadata:
      labels: {app: mts-postgres, mts-component: postgres}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: mts}
            - {name: POSTGRES_USER, value: mts}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: mts-private, key: POSTGRES_PASSWORD}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          startupProbe:
            exec: {command: [pg_isready, -U, mts, -d, mts]}
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            exec: {command: [pg_isready, -U, mts, -d, mts]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [pg_isready, -U, mts, -d, mts]}
            periodSeconds: 30
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: mts-postgres-data}
        - name: run
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
