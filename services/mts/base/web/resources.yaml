apiVersion: v1
kind: Service
metadata: {name: mts-web}
spec:
  selector: {app: mts-web}
  ports: [{name: http, port: 3000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mts-web}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  template:
    metadata:
      labels: {app: mts-web, mts-component: web}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: ghcr-pull-secret}]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: mts-web
          ports: [{name: http, containerPort: 3000}]
          env: [{name: API_INTERNAL_URL, value: 'http://mts-backend:8000'}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          startupProbe:
            httpGet: {path: /release.json, port: http}
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /release.json, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /release.json, port: http}
            periodSeconds: 30
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: cache, mountPath: /app/.next/cache}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
        - name: cache
          emptyDir: {sizeLimit: 64Mi}
