# MTS runs natively on the voice VPS. Traefik reaches it only over WireGuard.
apiVersion: v1
kind: Service
metadata:
  name: mts-native-api
  annotations: {argocd.argoproj.io/sync-wave: '-1'}
spec:
  ports: [{name: http, port: 8088, targetPort: 18088}]
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: mts-native-api
  labels:
    kubernetes.io/service-name: mts-native-api
    endpointslice.kubernetes.io/managed-by: chota-gitops
  annotations: {argocd.argoproj.io/sync-wave: '-1'}
addressType: IPv4
ports: [{name: http, protocol: TCP, port: 18088}]
endpoints:
  - addresses: [10.250.0.2]
    conditions: {ready: true}
---
apiVersion: v1
kind: Service
metadata:
  name: mts-native-web
  annotations: {argocd.argoproj.io/sync-wave: '-1'}
spec:
  ports: [{name: http, port: 3001, targetPort: 13001}]
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: mts-native-web
  labels:
    kubernetes.io/service-name: mts-native-web
    endpointslice.kubernetes.io/managed-by: chota-gitops
  annotations: {argocd.argoproj.io/sync-wave: '-1'}
addressType: IPv4
ports: [{name: http, protocol: TCP, port: 13001}]
endpoints:
  - addresses: [10.250.0.2]
    conditions: {ready: true}
