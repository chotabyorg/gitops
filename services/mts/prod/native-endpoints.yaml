# Traefik forwards these services directly to the private WireGuard IP.
# Its existing ExternalName support avoids ArgoCD's default EndpointSlice exclusion.
# These names are for Traefik routes, not DNS-based in-cluster service discovery.
apiVersion: v1
kind: Service
metadata:
  name: mts-native-api
  annotations: {argocd.argoproj.io/sync-wave: '-1'}
spec:
  type: ExternalName
  externalName: '10.250.0.2'
  ports: [{name: http, port: 18088}]
---
apiVersion: v1
kind: Service
metadata:
  name: mts-native-web
  annotations: {argocd.argoproj.io/sync-wave: '-1'}
spec:
  type: ExternalName
  externalName: '10.250.0.2'
  ports: [{name: http, port: 13001}]
