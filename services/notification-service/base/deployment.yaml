apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 1
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - image: notification-service
          name: notification-service
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: notification-config
            - secretRef:
                name: notification-secret
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5