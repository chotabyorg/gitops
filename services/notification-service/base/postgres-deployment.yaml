apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service-postgres
spec:
  replicas: 1
  template:
    spec:
      containers:
        - image: postgres:15-alpine
          name: postgres
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          envFrom:
            - configMapRef:
                name: notification-service-postgres-config
            - secretRef:
                name: notification-secret
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: notification-service-postgres-data