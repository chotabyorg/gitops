apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - sealed-secrets.yaml
namespace: prod
images:
  - name: notification-service
    newName: ghcr.io/chotabyorg/notification-service
    newTag: "1b3da35"
configMapGenerator:
  - name: notification-config
    env: config.properties
  - name: notification-service-postgres-config
    env: postgres.properties
