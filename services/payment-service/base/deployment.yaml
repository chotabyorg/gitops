apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  replicas: 1
  template:
    metadata:
      labels:
        component: api
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - image: payment-service
          name: payment-migrations
          command:
            - alembic
            - upgrade
            - head
          envFrom:
            - configMapRef:
                name: payment-config
            - secretRef:
                name: payment-secret
      containers:
        - image: payment-service
          name: payment-service
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: payment-config
            - secretRef:
                name: payment-secret
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
