apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
namespace: dev
images:
  - name: payment-service
    newName: ghcr.io/chotabyorg/payment-service
    newTag: latest
configMapGenerator:
  - name: payment-config
    env: config.properties
  - name: postgres-config
    env: postgres.properties
secretGenerator:
  - name: payment-secret
    env: secrets.properties