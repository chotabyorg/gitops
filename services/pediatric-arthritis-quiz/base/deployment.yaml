apiVersion: apps/v1
kind: Deployment
metadata:
  name: pediatric-arthritis-quiz
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pediatric-arthritis-quiz
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: pediatric-arthritis-quiz
          image: pediatric-arthritis-quiz
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: pediatric-arthritis-quiz-config
          env:
            - name: EVENT_PIN
              valueFrom:
                secretKeyRef:
                  name: pediatric-arthritis-quiz-secret
                  key: EVENT_PIN
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pediatric-arthritis-quiz-secret
                  key: ADMIN_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /test/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /test/healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pediatric-arthritis-quiz-data
