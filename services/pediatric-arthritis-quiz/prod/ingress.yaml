apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pediatric-arthritis-quiz-test
  namespace: prod
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`atlas.chota.by`) && PathPrefix(`/test`)
      priority: 100
      services:
        - kind: Service
          name: pediatric-arthritis-quiz
          namespace: prod
          port: 8080
  tls:
    certResolver: le
