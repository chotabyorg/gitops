  - ingress.yaml
  - sealed-secrets.yaml
images:
  - name: pediatric-arthritis-quiz
    newName: ghcr.io/chotabyorg/pediatric-arthritis-quiz
    newTag: latest
configMapGenerator:
  - name: pediatric-arthritis-quiz-config
    env: config.properties
