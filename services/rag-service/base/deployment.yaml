apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-service
spec:
  replicas: 1
  template:
    metadata:
      labels:
        component: api
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - image: rag-service
          name: rag-service
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: rag-service-config
            - secretRef:
                name: rag-service-secret
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
