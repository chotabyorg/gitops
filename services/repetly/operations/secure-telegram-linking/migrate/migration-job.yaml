apiVersion: batch/v1
kind: Job
metadata:
  name: repetly-telegram-linking-migrate-6cb8a89
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    repetly.chota.by/operation: secure-telegram-linking-migration
    repetly.chota.by/application-commit: 6cb8a891911d1c194ff7792790689d882b69cf0e
    repetly.chota.by/application-image: ghcr.io/chotabyorg/repetly:6cb8a89
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: repetly
        component: migration
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull-secret
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: repetly
          command:
            - node
            - node_modules/prisma/build/index.js
            - migrate
            - deploy
          env:
            - name: HOME
              value: /tmp
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: repetly-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
