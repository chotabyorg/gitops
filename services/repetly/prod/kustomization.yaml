apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - minio-bootstrap-config.yaml
  - minio-bootstrap-job.yaml
  - minio-deployment.yaml
  - minio-pvc.yaml
  - minio-service.yaml
  - minio-sealed-secrets.yaml
  - sealed-secrets.yaml
  - operations/notification-scheduler
patches:
  - path: repetly-deployment-wave-patch.yaml
  # Issue #75 OPEN after migration, production postflight, one Ready pod, and
  # direct-to-pod smoke checks passed. Backup/restore evidence:
  # https://github.com/chotabyorg/repetly/issues/75#issuecomment-5025216959
  # The migration Job stays absent; the verified digest and release identity
  # remain pinned while the ordinary Service selector is restored.
  - path: operations/secure-telegram-linking/release-identity-patch.yaml
namespace: prod
images:
  - name: repetly
    newName: ghcr.io/chotabyorg/repetly
    digest: sha256:814c45ea9f0bc886c1f13acd76e603904958f33d89a13e3dfc1c6dff1d928ed7
    newTag: c36296d
configMapGenerator:
  - name: repetly-config
    env: config.properties
  - name: repetly-postgres-config
    env: postgres.properties
