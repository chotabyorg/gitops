apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - sealed-secrets.yaml
namespace: prod
images:
  - name: repetly
    newName: ghcr.io/chotabyorg/repetly
    newTag: "7a2b7f5"
configMapGenerator:
  - name: repetly-config
    env: config.properties
  - name: repetly-postgres-config
    env: postgres.properties
