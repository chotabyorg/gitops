apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - minio-bootstrap-config.yaml
  - minio-bootstrap-job.yaml
  - minio-deployment.yaml
  - minio-pvc.yaml
  - minio-service.yaml
  - minio-sealed-secrets.yaml
  - sealed-secrets.yaml
patches:
  - path: repetly-deployment-wave-patch.yaml
  # Issue #75 RESUME-CLOSED after the retained migration Job completed and the
  # aggregate production postflight passed. Backup/restore evidence:
  # https://github.com/chotabyorg/repetly/issues/75#issuecomment-5025216959
  # Keep public traffic closed until the new pod is Ready and direct smoke
  # checks pass; do not recreate or rerun the migration Job.
  - path: operations/secure-telegram-linking/resume-closed/service-traffic-closed-patch.yaml
  - path: operations/secure-telegram-linking/release-identity-patch.yaml
namespace: prod
images:
  - name: repetly
    newName: ghcr.io/chotabyorg/repetly
    digest: sha256:59f3d7433fee8eb3646dcd5918fbdb97019cf58a9cb3834d097ea2b9f1c06724
configMapGenerator:
  - name: repetly-config
    env: config.properties
  - name: repetly-postgres-config
    env: postgres.properties
