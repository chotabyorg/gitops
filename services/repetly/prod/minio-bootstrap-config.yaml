apiVersion: v1
kind: ConfigMap
metadata:
  name: repetly-minio-bootstrap
data:
  policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": [
            "s3:GetObject",
            "s3:PutObject",
            "s3:DeleteObject"
          ],
          "Resource": [
            "arn:aws:s3:::repetly-homework/*"
          ]
        }
      ]
    }
