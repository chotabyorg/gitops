apiVersion: batch/v1
kind: Job
metadata:
  name: repetly-telegram-linking-migrate-6cb8a89-a1
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    repetly.chota.by/operation: secure-telegram-linking-migration
    repetly.chota.by/migration-attempt: "1"
    repetly.chota.by/application-commit: 6cb8a891911d1c194ff7792790689d882b69cf0e
    repetly.chota.by/application-image-digest: sha256:1fe2b603a398011cbe93166fdf0ddecfa0569c0aaf0ad9a68d5c99ac5aabed9b
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: repetly
        component: migration
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull-secret
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # Fail-closed inert sentinel. An execution PR must replace this with the
          # independently verified digest for the reviewed application commit.
          image: ghcr.io/chotabyorg/repetly@sha256:1fe2b603a398011cbe93166fdf0ddecfa0569c0aaf0ad9a68d5c99ac5aabed9b
          imagePullPolicy: Always
          command:
            - node
            - node_modules/prisma/build/index.js
            - migrate
            - deploy
          env:
            - name: HOME
              value: /tmp
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: repetly-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
