apiVersion: apps/v1
kind: Deployment
metadata:
  name: repetly
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  template:
    metadata:
      annotations:
        # Rotate the Pod template so the application reloads CRON_SECRET before
        # the separately reviewed CronJob activation transition.
        repetly.chota.by/cron-secret-revision: "2026-07-21-2"
        repetly.chota.by/telegram-webhook-secret-revision: "2026-07-14-1"
        # Force ArgoCD to replace any pod rendered before the health/proxy contract rollout.
        repetly.chota.by/health-rollout-revision: "2026-08-04-2"
