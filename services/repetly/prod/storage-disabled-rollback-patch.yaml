apiVersion: apps/v1
kind: Deployment
metadata:
  name: repetly
spec:
  template:
    spec:
      initContainers:
        - name: repetly-migrations
          env:
            - name: S3_ACCESS_KEY_ID
              value: ""
            - name: S3_SECRET_ACCESS_KEY
              value: ""
      containers:
        - name: repetly
          env:
            - name: S3_ACCESS_KEY_ID
              value: ""
            - name: S3_SECRET_ACCESS_KEY
              value: ""
