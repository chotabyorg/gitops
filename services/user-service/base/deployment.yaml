apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: 1
  template:
    metadata:
      labels:
        component: api
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - image: user-service
          name: user-service-migrations
          command:
            - alembic
            - upgrade
            - head
          envFrom:
            - configMapRef:
                name: user-service-config
            - secretRef:
                name: user-service-secret
      containers:
        - image: user-service
          name: user-service
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: user-service-config
            - secretRef:
                name: user-service-secret
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
