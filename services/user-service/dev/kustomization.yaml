apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - sealed-secrets.yaml
namespace: dev
images:
  - name: user-service
    newName: ghcr.io/chotabyorg/user-service
    newTag: latest
configMapGenerator:
  - name: user-service-config
    env: config.properties
  - name: user-service-postgres-config
    env: postgres.properties
