apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - sealed-secrets.yaml
namespace: prod
images:
  - name: user-service
    newName: ghcr.io/chotabyorg/user-service
    newTag: "dd2472e"
configMapGenerator:
  - name: user-service-config
    env: config.properties
  - name: user-service-postgres-config
    env: postgres.properties
patches:
  - path: notification-api-key-env-patch.yaml
