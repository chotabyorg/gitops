apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-gateway-service
spec:
  replicas: 1
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - image: website-gateway-service
          name: website-gateway-service
          ports:
            - containerPort: 8080
          env:
            - name: CHAT_S2S_TOKEN
              valueFrom:
                secretKeyRef:
                  name: chat-s2s-secret
                  key: CHAT_S2S_TOKEN
                  optional: true
          envFrom:
            - configMapRef:
                name: website-gateway-config
            - secretRef:
                name: website-gateway-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 3
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
