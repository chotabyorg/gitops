apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-gateway-service
spec:
  replicas: 1
  template:
    spec:
      containers:
        - image: website-gateway-service
          name: website-gateway-service
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: website-gateway-config
            - secretRef:
                name: website-gateway-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 3
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5