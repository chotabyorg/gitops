apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-gateway-service
spec:
  replicas: 1
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - image: whatsapp-gateway-service
          name: whatsapp-gateway-service
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: whatsapp-gateway-config
            - secretRef:
                name: whatsapp-gateway-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 3
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
